name: Nifty 500 Live Auto Scanner

on:
  schedule:
    # திங்கள் முதல் வெள்ளி வரை காலை 9:00 AM முதல் மாலை 6:30 PM IST வரை ஒவ்வொரு 15 நிமிடத்திற்கும் தானாக ஓடும்
    - cron: '*/15 3-13 * * 1-5'
  workflow_dispatch: # நீங்களே நினைத்த நேரத்தில் பட்டன் தட்டி Run செய்ய உதவும்

permissions:
  contents: write

jobs:
  scan_and_update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run NSE + Gemini AI Scanner
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python update_live_data.py

      - name: Commit & Push Updated live_data.json
        run: |
          git config --global user.name "AlphaPulse AutoBot"
          git config --global user.email "bot@alphapulse.local"
          git add live_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update live Nifty 500 signals" && git push)
